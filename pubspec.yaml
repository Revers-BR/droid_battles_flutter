name: droid_battles
description: >
  Conversão para Flutter do jogo "droidbattles" (originalmente C++/Qt,
  https://github.com/Revers-BR/droidbattles) — um jogo de programação
  onde o jogador programa bots em assembly que lutam em uma arena.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
